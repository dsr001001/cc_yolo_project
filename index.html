<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Pinball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; color: #fff; }
  canvas { display: block; background: #001; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 8px; background: rgba(0,0,0,0.7); font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; z-index: 5; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.92); text-align: center; padding: 20px; z-index: 10; }
  #overlay h1 { font-size: 48px; margin-bottom: 12px; }
  #overlay p { font-size: 18px; margin-bottom: 20px; opacity: 0.85; }
  #overlay button { padding: 14px 28px; font-size: 18px; background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud"><span>PINBALL</span> <span id="score">0</span> <span id="balls">●●●</span></div>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>PINBALL</h1>
  <p id="msg">Tap left/right to flip. Keep the ball alive!</p>
  <button id="start">Start</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const ballsEl = document.getElementById('balls');
  const startBtn = document.getElementById('start');
  const msgEl = document.getElementById('msg');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.innerHeight = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // Audio synth
  let audio = null;
  function ensureAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio?.state === 'suspended') audio.resume();
  }
  function beep(freq, dur, gain = 0.12) {
    if (!audio) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  function sndBumper() { beep(800, 0.08); }
  function sndFlipper() { beep(500, 0.06); }
  function sndDrain() { setTimeout(() => beep(300, 0.15), 0); setTimeout(() => beep(200, 0.15), 150); }
  function sndCombo(level) { const f = 400 + level * 100; beep(f, 0.1); }

  const state = {
    ballX: 0, ballY: 0, ballVX: 0, ballVY: 0, ballR: 0,
    leftFlipY: 0, rightFlipY: 0, flipperL: false, flipperR: false,
    score: 0, combo: 0, comboT: 0, balls: 3, running: false, gameOver: false,
    bumpers: [], ramps: [],
    flashT: 0, flashMsg: '', flashX: 0, flashY: 0
  };

  function init() {
    state.ballR = W * 0.025;
    const margin = W * 0.1;
    state.leftFlipY = H - H * 0.15;
    state.rightFlipY = H - H * 0.15;

    // Bumpers (5-7 scattered)
    state.bumpers = [
      {x: W*0.25, y: H*0.2, r: W*0.035, hit: false},
      {x: W*0.75, y: H*0.22, r: W*0.035, hit: false},
      {x: W*0.5, y: H*0.35, r: W*0.035, hit: false},
      {x: W*0.2, y: H*0.5, r: W*0.035, hit: false},
      {x: W*0.8, y: H*0.48, r: W*0.035, hit: false},
      {x: W*0.5, y: H*0.65, r: W*0.035, hit: false},
    ];

    newBall();
  }

  function newBall() {
    state.ballX = W * 0.5;
    state.ballY = H * 0.05;
    state.ballVX = (Math.random() - 0.5) * 2;
    state.ballVY = 1;
    state.combo = 0;
    state.comboT = 0;
    state.bumpers.forEach(b => b.hit = false);
  }

  // Input
  document.addEventListener('touchstart', (e) => {
    ensureAudio();
    if (!state.running) return;
    for (const t of e.touches) {
      if (t.clientX * devicePixelRatio < W / 2) state.flipperL = true;
      else state.flipperR = true;
    }
  });
  document.addEventListener('touchend', () => {
    state.flipperL = false;
    state.flipperR = false;
  });

  // Physics
  function step() {
    if (!state.running || state.gameOver) return;

    const g = H * 0.0008; // gravity
    state.ballVY += g;
    state.ballVX *= 0.995; // air resistance
    state.ballVY = Math.min(state.ballVY, H * 0.01);

    state.ballX += state.ballVX;
    state.ballY += state.ballVY;

    // Walls
    if (state.ballX - state.ballR < 0) { state.ballX = state.ballR; state.ballVX *= -0.8; }
    if (state.ballX + state.ballR > W) { state.ballX = W - state.ballR; state.ballVX *= -0.8; }
    if (state.ballY - state.ballR < 0) { state.ballY = state.ballR; state.ballVY *= -0.8; }

    // Bumpers
    state.bumpers.forEach(b => {
      const dx = state.ballX - b.x;
      const dy = state.ballY - b.y;
      const d = Math.hypot(dx, dy);
      if (d < state.ballR + b.r) {
        const a = Math.atan2(dy, dx);
        state.ballX = b.x + Math.cos(a) * (state.ballR + b.r);
        state.ballY = b.y + Math.sin(a) * (state.ballR + b.r);
        const spd = 12;
        state.ballVX = Math.cos(a) * spd;
        state.ballVY = Math.sin(a) * spd;
        if (!b.hit) {
          b.hit = true;
          state.score += 100 * Math.max(1, Math.floor(state.combo / 2));
          state.combo++;
          state.comboT = 120;
          sndBumper();
          flash(`+${100 * Math.max(1, Math.floor(state.combo / 2))}`, b.x, b.y);
        }
      }
    });

    // Flippers
    const flipL = {x: W*0.35, y: state.leftFlipY, len: W*0.12, angle: state.flipperL ? -0.4 : 0.3};
    const flipR = {x: W*0.65, y: state.rightFlipY, len: W*0.12, angle: state.flipperR ? 0.4 : -0.3};

    for (const flip of [flipL, flipR]) {
      const fx = flip.x + Math.cos(flip.angle) * flip.len;
      const fy = flip.y + Math.sin(flip.angle) * flip.len;
      const closest = closest2D(state.ballX, state.ballY, flip.x, flip.y, fx, fy, state.ballR);
      if (closest.d < state.ballR) {
        state.ballX = closest.x + closest.nx * state.ballR;
        state.ballY = closest.y + closest.ny * state.ballR;
        const spd = state.flipperL || state.flipperR ? 16 : 8;
        state.ballVX = closest.nx * spd;
        state.ballVY = closest.ny * spd - 2;
        sndFlipper();
      }
    }

    // Drain (fall off bottom)
    if (state.ballY > H + state.ballR) {
      sndDrain();
      state.balls--;
      ballsEl.textContent = '●'.repeat(Math.max(0, state.balls));
      if (state.balls <= 0) {
        state.gameOver = true;
        state.running = false;
        setTimeout(showGameOver, 500);
      } else {
        newBall();
      }
    }

    if (state.comboT > 0) state.comboT--;
    if (state.flashT > 0) state.flashT--;
  }

  // Closest point on line segment to circle
  function closest2D(cx, cy, x1, y1, x2, y2, r) {
    const dx = x2 - x1, dy = y2 - y1;
    let t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / (dx * dx + dy * dy)));
    const px = x1 + t * dx;
    const py = y1 + t * dy;
    const d = Math.hypot(cx - px, cy - py);
    const nx = d > 0 ? (cx - px) / d : 0;
    const ny = d > 0 ? (cy - py) / d : -1;
    return {x: px, y: py, d, nx, ny};
  }

  function flash(msg, x, y) {
    state.flashT = 40;
    state.flashMsg = msg;
    state.flashX = x;
    state.flashY = y;
  }

  function showGameOver() {
    msgEl.textContent = `Game Over! Final Score: ${state.score}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.fillStyle = '#001';
    ctx.fillRect(0, 0, W, H);

    // Bumpers
    ctx.fillStyle = '#f80';
    state.bumpers.forEach(b => {
      ctx.globalAlpha = b.hit ? 0.5 : 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Flippers
    ctx.strokeStyle = '#4f8';
    ctx.lineWidth = W * 0.015;
    const flipL = {x: W*0.35, y: state.leftFlipY, len: W*0.12, angle: state.flipperL ? -0.4 : 0.3};
    const flipR = {x: W*0.65, y: state.rightFlipY, len: W*0.12, angle: state.flipperR ? 0.4 : -0.3};
    for (const flip of [flipL, flipR]) {
      const fx = flip.x + Math.cos(flip.angle) * flip.len;
      const fy = flip.y + Math.sin(flip.angle) * flip.len;
      ctx.beginPath();
      ctx.moveTo(flip.x, flip.y);
      ctx.lineTo(fx, fy);
      ctx.stroke();
    }

    // Ball
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(state.ballX, state.ballY, state.ballR, 0, Math.PI * 2);
    ctx.fill();

    // Combo indicator
    if (state.comboT > 0) {
      ctx.globalAlpha = Math.min(1, state.comboT / 30);
      ctx.fillStyle = state.combo > 3 ? '#f00' : state.combo > 1 ? '#ff0' : '#0f0';
      ctx.font = `bold ${Math.floor(H * 0.08)}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`×${state.combo}`, W / 2, H * 0.15);
      ctx.globalAlpha = 1;
    }

    // Flash score
    if (state.flashT > 0) {
      ctx.globalAlpha = Math.min(1, state.flashT / 20);
      ctx.fillStyle = '#ff0';
      ctx.font = `bold ${Math.floor(H * 0.05)}px monospace`;
      ctx.fillText(state.flashMsg, state.flashX, state.flashY);
      ctx.globalAlpha = 1;
    }

    // Update HUD
    scoreEl.textContent = state.score;
  }

  function loop() {
    step();
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    ensureAudio();
    state.score = 0;
    state.balls = 3;
    state.gameOver = false;
    state.running = true;
    ballsEl.textContent = '●●●';
    scoreEl.textContent = '0';
    msgEl.textContent = 'Tap left/right to flip. Keep the ball alive!';
    overlay.classList.add('hidden');
    init();
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
