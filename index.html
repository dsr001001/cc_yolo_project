<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; color: #fff; }
  canvas { display: block; background: #000; touch-action: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); text-align: center; padding: 20px; z-index: 10; }
  #overlay h1 { font-size: 48px; letter-spacing: 8px; margin-bottom: 12px; }
  #overlay p { font-size: 16px; opacity: 0.8; margin-bottom: 24px; }
  #overlay button { padding: 14px 28px; font-size: 18px; background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>PONG</h1>
  <p>Drag anywhere on your side to move your paddle.<br>First to 5 wins.</p>
  <button id="start">Start</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const state = {
    playerY: 0, aiY: 0, paddleH: 0, paddleW: 0,
    ballX: 0, ballY: 0, ballVX: 0, ballVY: 0, ballR: 0,
    playerScore: 0, aiScore: 0, running: false, winner: null
  };

  function reset(serveRight) {
    state.paddleH = H * 0.18;
    state.paddleW = Math.max(8 * devicePixelRatio, W * 0.015);
    state.ballR = Math.max(6 * devicePixelRatio, W * 0.012);
    state.playerY = H / 2 - state.paddleH / 2;
    state.aiY = H / 2 - state.paddleH / 2;
    state.ballX = W / 2;
    state.ballY = H / 2;
    const speed = Math.min(W, H) * 0.008;
    const angle = (Math.random() - 0.5) * 0.6;
    state.ballVX = (serveRight ? 1 : -1) * speed * Math.cos(angle);
    state.ballVY = speed * Math.sin(angle);
  }

  function pointerMove(e) {
    if (!state.running) return;
    const touches = e.touches ? Array.from(e.touches) : [{clientX: e.clientX, clientY: e.clientY}];
    for (const t of touches) {
      const x = t.clientX * devicePixelRatio;
      const y = t.clientY * devicePixelRatio;
      if (x < W / 2) {
        state.playerY = Math.max(0, Math.min(H - state.paddleH, y - state.paddleH / 2));
      }
    }
    e.preventDefault();
  }
  canvas.addEventListener('touchstart', pointerMove, { passive: false });
  canvas.addEventListener('touchmove', pointerMove, { passive: false });
  canvas.addEventListener('mousemove', pointerMove);

  function step() {
    if (!state.running) return;

    state.ballX += state.ballVX;
    state.ballY += state.ballVY;

    if (state.ballY - state.ballR < 0) { state.ballY = state.ballR; state.ballVY *= -1; }
    if (state.ballY + state.ballR > H) { state.ballY = H - state.ballR; state.ballVY *= -1; }

    const pPadX = state.paddleW * 1.5;
    if (state.ballVX < 0 && state.ballX - state.ballR < pPadX + state.paddleW &&
        state.ballX - state.ballR > pPadX - state.paddleW &&
        state.ballY > state.playerY && state.ballY < state.playerY + state.paddleH) {
      state.ballX = pPadX + state.paddleW + state.ballR;
      state.ballVX = Math.abs(state.ballVX) * 1.05;
      const hit = (state.ballY - (state.playerY + state.paddleH / 2)) / (state.paddleH / 2);
      state.ballVY += hit * Math.min(W, H) * 0.004;
    }

    const aPadX = W - state.paddleW * 1.5;
    if (state.ballVX > 0 && state.ballX + state.ballR > aPadX - state.paddleW &&
        state.ballX + state.ballR < aPadX + state.paddleW &&
        state.ballY > state.aiY && state.ballY < state.aiY + state.paddleH) {
      state.ballX = aPadX - state.paddleW - state.ballR;
      state.ballVX = -Math.abs(state.ballVX) * 1.05;
      const hit = (state.ballY - (state.aiY + state.paddleH / 2)) / (state.paddleH / 2);
      state.ballVY += hit * Math.min(W, H) * 0.004;
    }

    const aiCenter = state.aiY + state.paddleH / 2;
    const aiSpeed = Math.min(W, H) * 0.007;
    if (aiCenter < state.ballY - 10) state.aiY += aiSpeed;
    else if (aiCenter > state.ballY + 10) state.aiY -= aiSpeed;
    state.aiY = Math.max(0, Math.min(H - state.paddleH, state.aiY));

    if (state.ballX < -state.ballR) { state.aiScore++; checkWin(); reset(true); }
    else if (state.ballX > W + state.ballR) { state.playerScore++; checkWin(); reset(false); }
  }

  function checkWin() {
    if (state.playerScore >= 5) { state.winner = 'YOU WIN'; state.running = false; showOverlay(); }
    else if (state.aiScore >= 5) { state.winner = 'YOU LOSE'; state.running = false; showOverlay(); }
  }

  function showOverlay() {
    overlay.querySelector('h1').textContent = state.winner || 'PONG';
    overlay.querySelector('p').innerHTML = state.winner
      ? `Final: ${state.playerScore} - ${state.aiScore}`
      : 'Drag anywhere on your side to move your paddle.<br>First to 5 wins.';
    startBtn.textContent = state.winner ? 'Play Again' : 'Start';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.setLineDash([10 * devicePixelRatio, 10 * devicePixelRatio]);
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(H * 0.12)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(state.playerScore, W * 0.25, H * 0.18);
    ctx.fillText(state.aiScore, W * 0.75, H * 0.18);

    ctx.fillRect(state.paddleW, state.playerY, state.paddleW, state.paddleH);
    ctx.fillRect(W - state.paddleW * 2, state.aiY, state.paddleW, state.paddleH);

    ctx.beginPath();
    ctx.arc(state.ballX, state.ballY, state.ballR, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    step();
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    state.playerScore = 0; state.aiScore = 0; state.winner = null;
    resize();
    reset(Math.random() < 0.5);
    state.running = true;
    overlay.classList.add('hidden');
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
